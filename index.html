<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="An interactive, 2D kid-doodle storybook following 8-year-old Prajwal's spark of invention with real-time accessibility and character portfolio." />
    <meta property="og:title" content="The Circuit Kid — Baby's First Website" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@600;700&family=Gaegu:wght@400;700&family=Lexend:wght@400;600;700;800&family=Patrick+Hand&family=Patrick+Hand+SC&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#fdfaf2] text-[#232323] antialiased selection:bg-yellow-200 selection:text-black">
    <!-- Hidden SVG filter for hand-drawn / boiling line effect -->
    <svg class="hidden" aria-hidden="true">
      <defs>
        <filter id="wobbly-line-1">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" seed="1" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="wobbly-line-2">
          <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" seed="42" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="crayon-rough">
          <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="rough" seed="12" />
          <feDisplacementMap in="SourceGraphic" in2="rough" scale="2.5" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
